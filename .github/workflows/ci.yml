name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - run: make install
      - run: make build
      - run: make lint
      - run: make test
